<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Auth FastAPI</title>
    <!-- Este documento fue creado con IA y este mensaje lo coloco el autor de este proyecto -->
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>

</head>

<body>

    <h1>Pruebas JWT FastAPI</h1>

    <div class="card">

        <h2>Registro</h2>

        <input id="reg_username" placeholder="Usuario">

        <input id="reg_email" placeholder="Correo">

        <input id="reg_password" type="password" placeholder="Contraseña">

        <select id="reg_role">
            <option value="viewer">viewer</option>
            <option value="editor">editor</option>
        </select>

        <button onclick="registerUser()">
            Registrar
        </button>

    </div>

    <div class="card">

        <h2>Login</h2>

        <input id="login_email" placeholder="Correo">

        <input id="login_password" type="password" placeholder="Contraseña">

        <button onclick="login()">
            Iniciar sesión
        </button>

    </div>

    <div class="card">

        <h2>JWT almacenado</h2>

        <button onclick="showToken()">
            Mostrar token
        </button>

    </div>

    <h2>Respuesta</h2>

    <pre id="response"></pre>

    <script>

        const API_URL = "http://127.0.0.1:8000";

        async function registerUser() {

            try {

                const response = await fetch(
                    `${API_URL}/auth/register`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            username:
                                document.getElementById(
                                    "reg_username"
                                ).value,

                            email:
                                document.getElementById(
                                    "reg_email"
                                ).value,

                            password:
                                document.getElementById(
                                    "reg_password"
                                ).value,

                            role:
                                document.getElementById(
                                    "reg_role"
                                ).value
                        })
                    }
                );

                const data = await response.json();

                showResult(data);

            } catch (error) {

                showResult(error);

            }

        }

        async function login() {

            const response = await fetch(
                `${API_URL}/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        email:
                            document.getElementById("login_email").value,
                        password:
                            document.getElementById("login_password").value
                    })
                }
            );

            const data = await response.json();

            if (data.data.user_token) {

                localStorage.setItem(
                    "token",
                    data.data.user_token
                );

            }

            document.getElementById("response")
                .textContent = JSON.stringify(
                    data,
                    null,
                    4
                );
        }
        function showToken() {

            const token =
                localStorage.getItem("token");

            showResult({
                token
            });

        }

        function showResult(data) {

            document.getElementById(
                "response"
            ).textContent =
                JSON.stringify(
                    data,
                    null,
                    4
                );

        }

    </script>

</body>

</html>
